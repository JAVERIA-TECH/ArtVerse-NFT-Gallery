<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ArtVerse NFT Gallery</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="style.css">
</head>
<body class="bg-zinc-950 text-white min-h-screen antialiased">

    <div id="message-box" class="fixed top-20 left-1/2 -translate-x-1/2 bg-yellow-500 text-zinc-950 p-4 rounded-lg shadow-xl z-50 transition-all duration-300 transform scale-0 origin-top opacity-0"></div>

    <header class="fixed top-0 left-0 w-full z-40 bg-zinc-950 bg-opacity-70 backdrop-blur-lg shadow-lg p-4 md:p-6 flex justify-between items-center transition-all duration-300">
        <div class="flex items-center space-x-8">
            <button id="logo-button" class="text-xl md:text-3xl font-extrabold text-transparent bg-clip-text bg-gradient-to-r from-yellow-400 to-red-500 transition-colors duration-300 hover:scale-105 transform">
                ArtVerse
            </button>
            <nav class="hidden md:flex space-x-6">
                <button id="nav-home" class="text-zinc-300 font-medium hover:text-white transition-colors duration-300">Home</button>
                <button id="nav-gallery" class="text-zinc-300 font-medium hover:text-white transition-colors duration-300">Gallery</button>
                <button id="nav-about" class="text-zinc-300 font-medium hover:text-white transition-colors duration-300">About</button>
                <button id="nav-contact" class="text-zinc-300 font-medium hover:text-white transition-colors duration-300">Contact Us</button>
                <button id="nav-team-portal" class="text-zinc-300 font-medium hover:text-white transition-colors duration-300 hidden">Team Portal</button>
            </nav>
        </div>
        <div class="flex items-center space-x-4">
            <button id="cart-button" class="relative text-zinc-300 hover:text-white transition-colors duration-300 transform hover:scale-110">
                <svg class="w-7 h-7" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 3h2l.4 2M7 13h10l4-8H5.4M7 13L5.4 5M7 13l-2.293 2.293c-.63.63-.182 1.707.707 1.707H17m0 0a2 2 0 100 4 2 2 0 000-4zm-8 2a2 2 0 11-4 0 2 2 0 014 0z"></path>
                </svg>
                <span id="cart-count" class="absolute -top-1 -right-1 bg-red-500 text-white text-xs rounded-full h-5 w-5 flex items-center justify-center hidden animate-bounce font-bold"></span>
            </button>
            <div id="user-controls" class="flex items-center space-x-2">
                <button id="login-btn" class="bg-zinc-800 text-zinc-300 py-2 px-5 rounded-full hover:bg-zinc-700 transition-colors duration-300 font-medium">Login</button>
                <button id="signup-btn" class="bg-yellow-500 text-zinc-950 py-2 px-5 rounded-full hover:bg-yellow-400 transition-colors duration-300 font-medium">Signup</button>
            </div>
        </div>
    </header>

    <main id="app-container" class="pt-24 pb-12 px-4 md:px-8 max-w-7xl mx-auto">
    </main>

    <footer class="bg-zinc-900 text-zinc-500 py-10 px-4 md:px-8 mt-16 rounded-t-3xl shadow-lg">
        <div class="container mx-auto flex flex-col items-center text-center space-y-6">
            <div class="flex space-x-8 text-2xl md:text-3xl">
                <a href="#" class="hover:text-white transition-colors duration-300 transform hover:scale-110">
                    <svg class="w-8 h-8 fill-current" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path d="M12 2.163c3.204 0 3.584.012 4.85.07 3.252.148 4.771 1.691 4.919 4.919.058 1.265.07 1.645.07 4.85s-.012 3.584-.07 4.85c-.149 3.225-1.664 4.771-4.919 4.919-1.266.058-1.644.07-4.85.07s-3.585-.012-4.85-.07c-3.251-.149-4.771-1.691-4.919-4.919-.058-1.265-.07-1.644-.07-4.85s.012-3.584.07-4.85c.149-3.227 1.664-4.771 4.919-4.919 1.266-.057 1.645-.07 4.85-.07zm0-2.163c-3.259 0-3.667.014-4.947.072-4.358.2-6.78 2.618-6.98 6.98-.059 1.281-.073 1.689-.073 4.948 0 3.259.014 3.668.072 4.948.2 4.358 2.618 6.78 6.98 6.98 1.281.058 1.689.072 4.948.072 3.259 0 3.668-.014 4.948-.072 4.354-.2 6.782-2.618 6.979-6.98.059-1.28.073-1.689.073-4.948 0-3.259-.014-3.667-.072-4.947-.196-4.354-2.617-6.78-6.979-6.98-1.281-.059-1.689-.073-4.948-.073zM12 5.838c-3.403 0-6.162 2.759-6.162 6.162s2.759 6.162 6.162 6.162 6.162-2.759 6.162-6.162-2.759-6.162-6.162-6.162zm0 10.162c-2.209 0-4-1.791-4-4s1.791-4 4-4 4 1.791 4 4-1.791 4-4 4zM18.406 7.155c-.796 0-1.442.646-1.442 1.442s.646 1.442 1.442 1.442 1.442-.646 1.442-1.442-.646-1.442-1.442-1.442z"></path></svg>
                </a>
                <a href="#" class="hover:text-white transition-colors duration-300 transform hover:scale-110">
                    <svg class="w-8 h-8 fill-current" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path d="M19 0h-14c-2.761 0-5 2.239-5 5v14c0 2.761 2.239 5 5 5h14c2.762 0 5-2.239 5-5v-14c0-2.761-2.238-5-5-5zm-11 19h-3v-11h3v11zm-1.5-12.268c-.966 0-1.75-.79-1.75-1.768s.784-1.768 1.75-1.768 1.75.79 1.75 1.768-.784 1.768-1.75 1.768zm13.5 12.268h-3v-5.604c0-3.368-4-3.113-4 0v5.604h-3v-11h3v1.765c1.396-2.586 7-2.777 7 2.476v6.759z"></path></svg>
                </a>
                <a href="#" class="hover:text-white transition-colors duration-300 transform hover:scale-110">
                    <svg class="w-8 h-8 fill-current" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path d="M12 2c-5.514 0-10 4.486-10 10s4.486 10 10 10 10-4.486 10-10-4.486-10-10-10zm0 18c-4.411 0-8-3.589-8-8s3.589-8 8-8 8 3.589 8 8-3.589 8-8 8zm0-11c-1.104 0-2 .896-2 2s.896 2 2 2 2-.896 2-2-.896-2-2-2z"></path></svg>
                </a>
            </div>
            <p class="text-sm md:text-base text-zinc-400">
                <a href="mailto:info@artverse.com" class="hover:underline">info@artverse.com</a> | +92 123 4567890
            </p>
            <p class="text-sm md:text-base text-zinc-400">
                123 Main Street, Art City, Pakistan
            </p>
            <p class="text-xs text-zinc-600 mt-4">
                © 2025 ArtVerse. All rights reserved.
            </p>
        </div>
    </footer>
    <script src="script.js"></script>
</body>
</html>
